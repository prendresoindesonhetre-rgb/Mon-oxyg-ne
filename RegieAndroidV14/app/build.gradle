plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.prendresoindesonhetre.regiev14'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.prendresoindesonhetre.regiev14'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '14.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
