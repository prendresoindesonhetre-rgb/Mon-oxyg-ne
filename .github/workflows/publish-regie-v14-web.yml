name: Publish Regie V14 Web

on:
  push:
    branches: [ regie-v14-secure ]
    paths:
      - '.github/workflows/publish-regie-v14-web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: regie-v14-secure
          fetch-depth: 0

      - name: Fetch web application HTML
        run: |
          mkdir -p /tmp/regie-web
          curl --fail --silent --show-error --location \
            'https://kzviewbnnnzdyocdjtah.supabase.co/functions/v1/regie-app' \
            -o /tmp/regie-web/index.html
          grep -qi '<!doctype html>' /tmp/regie-web/index.html
          grep -q 'Régie de mon Hêtre' /tmp/regie-web/index.html
          grep -q 'regie-sync' /tmp/regie-web/index.html

      - name: Publish without touching the existing site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/pages origin/gh-pages
          mkdir -p /tmp/pages/regie-v14
          cp /tmp/regie-web/index.html /tmp/pages/regie-v14/index.html
          touch /tmp/pages/.nojekyll
          cd /tmp/pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add regie-v14/index.html .nojekyll
          if git diff --cached --quiet; then
            echo 'No web changes to publish.'
          else
            git commit -m 'Publish Regie de mon Hetre V14 web app'
            git push origin HEAD:gh-pages
          fi

