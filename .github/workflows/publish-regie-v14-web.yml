name: Publish Regie V14 Web

on:
  push:
    branches: [ regie-v14-secure ]
    paths:
      - '.github/workflows/publish-regie-v14-web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: regie-v14-secure
          fetch-depth: 0

      - name: Fetch web application HTML
        run: |
          mkdir -p /tmp/regie-web
          curl --fail --silent --show-error --location \
            'https://kzviewbnnnzdyocdjtah.supabase.co/functions/v1/regie-app' \
            -o /tmp/regie-web/index.html
          grep -qi '<!doctype html>' /tmp/regie-web/index.html
          grep -q 'Régie de mon Hêtre' /tmp/regie-web/index.html
          grep -q 'regie-sync' /tmp/regie-web/index.html

      - name: Align mobile player with web layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/regie-web/index.html')
          s=p.read_text(encoding='utf-8')
          css=r'''<style id="mobile-player-v141">
          @media(max-width:600px){
            #playerView.player{padding-bottom:calc(190px + env(safe-area-inset-bottom))}
            #autoRow.auto-row{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));width:min(calc(100% - 22px),738px);z-index:24;margin:0;padding:7px;border:1px solid var(--line);border-radius:18px;background:rgba(247,245,241,.96);box-shadow:0 -4px 18px rgba(64,58,55,.08);backdrop-filter:blur(10px)}
            #bottomControls{z-index:25}
            #guideCard{margin-bottom:110px}
            #guideScroll{height:50dvh;min-height:320px;max-height:560px}
            .screen{padding-bottom:calc(190px + env(safe-area-inset-bottom))}
          }
          </style>'''
          if 'mobile-player-v141' not in s:
              s=s.replace('</head>',css+'\n</head>')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'mobile-player-v141' /tmp/regie-web/index.html

      - name: Publish without touching the existing site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/pages origin/gh-pages
          mkdir -p /tmp/pages/regie-v14
          cp /tmp/regie-web/index.html /tmp/pages/regie-v14/index.html
          touch /tmp/pages/.nojekyll
          cd /tmp/pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add regie-v14/index.html .nojekyll
          if git diff --cached --quiet; then
            echo 'No web changes to publish.'
          else
            git commit -m 'Keep Regie controls visible on mobile'
            git push origin HEAD:gh-pages
          fi
