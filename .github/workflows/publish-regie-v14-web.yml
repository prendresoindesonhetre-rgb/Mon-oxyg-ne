name: Publish Regie V14 Web

on:
  push:
    branches: [ regie-v14-secure ]
    paths:
      - '.github/workflows/publish-regie-v14-web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: regie-v14-secure
          fetch-depth: 0

      - name: Fetch web application HTML
        run: |
          mkdir -p /tmp/regie-web
          curl --fail --silent --show-error --location \
            'https://kzviewbnnnzdyocdjtah.supabase.co/functions/v1/regie-app' \
            -o /tmp/regie-web/index.html
          grep -qi '<!doctype html>' /tmp/regie-web/index.html
          grep -q 'Régie de mon Hêtre' /tmp/regie-web/index.html
          grep -q 'regie-sync' /tmp/regie-web/index.html

      - name: Align mobile player with web layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/regie-web/index.html')
          s=p.read_text(encoding='utf-8')
          css=r'''<style id="mobile-player-v141">
          @media(max-width:600px){
            #playerView.player{padding-bottom:calc(190px + env(safe-area-inset-bottom))}
            #autoRow.auto-row{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));width:min(calc(100% - 22px),738px);z-index:24;margin:0;padding:7px;border:1px solid var(--line);border-radius:18px;background:rgba(247,245,241,.96);box-shadow:0 -4px 18px rgba(64,58,55,.08);backdrop-filter:blur(10px)}
            #bottomControls{z-index:25}
            #guideCard{margin-bottom:110px}
            #guideScroll{height:50dvh;min-height:320px;max-height:560px}
            .screen{padding-bottom:calc(190px + env(safe-area-inset-bottom))}
          }
          </style>'''
          if 'mobile-player-v141' not in s:
              s=s.replace('</head>',css+'\n</head>')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'mobile-player-v141' /tmp/regie-web/index.html

      - name: Restore locked Meditation Hypnosis session type
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/regie-web/index.html')
          s=p.read_text(encoding='utf-8')

          css=r'''<style id="locked-session-type-v142">
          .session-type-picker{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px}
          .session-type-picker .btn.active{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:800}
          .session-type-badge{display:inline-flex;align-items:center;margin:0 0 8px;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;color:var(--teal);background:var(--paper)}
          </style>'''
          if 'locked-session-type-v142' not in s:
              s=s.replace('</head>',css+'\n</head>')

          edit_anchor='<h2 style="margin-top:16px">Ma séance</h2>\n    <label class="field"><span>Titre</span><input type="text" id="editTitle"></label>'
          edit_block='''<h2 style="margin-top:16px">Ma séance</h2>
    <div class="field" id="sessionTypeField"><span>Type de séance</span>
      <div class="session-type-picker" id="sessionTypePicker">
        <button class="btn" type="button" data-session-type="meditation">Méditation</button>
        <button class="btn" type="button" data-session-type="hypnose">Hypnose</button>
      </div>
    </div>
    <label class="field"><span>Titre</span><input type="text" id="editTitle"></label>'''
          if 'id="sessionTypePicker"' not in s:
              if edit_anchor not in s:
                  raise SystemExit('edit anchor missing')
              s=s.replace(edit_anchor,edit_block,1)

          home_anchor='<div class="kicker">MA SÉANCE</div>\n      <div class="session-title" id="homeTitle"></div>'
          home_block='''<div class="kicker">MA SÉANCE</div>
      <div class="session-type-badge" id="homeSessionType">Type à choisir</div>
      <div class="session-title" id="homeTitle"></div>'''
          if 'id="homeSessionType"' not in s:
              if home_anchor not in s:
                  raise SystemExit('home anchor missing')
              s=s.replace(home_anchor,home_block,1)

          js=r'''<script id="locked-session-type-script-v142">
          (()=>{
            const norm=t=>t==="hypnose"?"hypnose":t==="meditation"?"meditation":"";
            const label=t=>t==="hypnose"?"Hypnose":t==="meditation"?"Méditation":"Type à choisir";
            const ensureDefault=()=>{try{if(typeof DEFAULT_STATE!=="undefined")DEFAULT_STATE.sessionType=""}catch{}};
            const current=()=>{try{return norm(state&&state.sessionType)}catch{return ""}};
            const paint=()=>{
              const t=current();
              document.querySelectorAll("[data-session-type]").forEach(b=>b.classList.toggle("active",b.dataset.sessionType===t));
              const badge=document.getElementById("homeSessionType");if(badge)badge.textContent=label(t);
            };
            window.setRegieSessionType=t=>{try{state.sessionType=norm(t);paint()}catch{}};
            ensureDefault();
            document.addEventListener("click",e=>{
              const b=e.target.closest?.("[data-session-type]");
              if(b){e.preventDefault();window.setRegieSessionType(b.dataset.sessionType);return;}
              if(e.target.closest?.("#editSessionBtn"))setTimeout(paint,0);
            });
            const open=document.getElementById("openRegieBtn");
            if(open)open.addEventListener("click",e=>{
              if(current())return;
              e.preventDefault();e.stopImmediatePropagation();
              showModal(`<div class="kicker">TYPE DE SÉANCE</div><h2>Que vas-tu guider ?</h2><p class="note">Choisis le type de cette séance. Ce choix restera enregistré avec elle.</p><div class="session-type-picker"><button class="btn" id="chooseMeditation">Méditation</button><button class="btn" id="chooseHypnose">Hypnose</button></div><button class="btn" style="width:100%;margin-top:10px" id="chooseCancel">Annuler</button>`);
              document.getElementById("chooseMeditation").onclick=()=>{window.setRegieSessionType("meditation");persistLocal();closeModal();startPlayer()};
              document.getElementById("chooseHypnose").onclick=()=>{window.setRegieSessionType("hypnose");persistLocal();closeModal();startPlayer()};
              document.getElementById("chooseCancel").onclick=closeModal;
            },true);
            const save=document.getElementById("saveSessionBtn");if(save)save.addEventListener("click",()=>paint());
            const reset=document.getElementById("resetSessionBtn");if(reset)reset.addEventListener("click",()=>setTimeout(paint,0));
            const obs=new MutationObserver(paint);const edit=document.getElementById("editView");if(edit)obs.observe(edit,{attributes:true,attributeFilter:["class"]});
            paint();
          })();
          </script>'''
          if 'locked-session-type-script-v142' not in s:
              s=s.replace('</body>',js+'\n</body>')

          p.write_text(s,encoding='utf-8')
          PY

      - name: Regression checks for validated functions
        run: |
          FILE=/tmp/regie-web/index.html
          grep -q 'locked-session-type-script-v142' "$FILE"
          grep -q 'Méditation' "$FILE"
          grep -q 'Hypnose' "$FILE"
          grep -q 'mobile-player-v141' "$FILE"
          grep -q 'id="autoRow"' "$FILE"
          grep -q 'id="guideScroll"' "$FILE"
          grep -q 'id="playPauseBtn"' "$FILE"
          grep -q 'id="musicCard"' "$FILE"
          grep -q 'id="phaseAutoBtn"' "$FILE"
          grep -q 'id="accountBtn"' "$FILE"
          grep -q 'regie-sync' "$FILE"
          grep -q 'manualScrollUntil' "$FILE"
          grep -q 'function toggleRun' "$FILE"
          grep -q 'faderEdge' "$FILE"

      - name: Publish same permanent web link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/pages origin/gh-pages
          mkdir -p /tmp/pages/regie-v14
          cp /tmp/regie-web/index.html /tmp/pages/regie-v14/index.html
          touch /tmp/pages/.nojekyll
          cd /tmp/pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add regie-v14/index.html .nojekyll
          if git diff --cached --quiet; then
            echo 'No web changes to publish.'
          else
            git commit -m 'Restore Meditation Hypnosis choice without removing validated functions'
            git push origin HEAD:gh-pages
          fi
