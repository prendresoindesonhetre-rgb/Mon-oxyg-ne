name: Publish Regie V14 Web

on:
  push:
    branches:
      - regie-v14-secure
    paths:
      - 'ChronoMeditation/web_v142_locked_patch.py'
      - '.github/workflows/publish-regie-v14-web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: regie-v14-secure
          fetch-depth: 0

      - name: Fetch web application
        run: >-
          curl --fail --silent --show-error --location
          https://kzviewbnnnzdyocdjtah.supabase.co/functions/v1/regie-app
          --output /tmp/regie-index.html

      - name: Restore and verify validated features
        run: python3 ChronoMeditation/web_v142_locked_patch.py /tmp/regie-index.html

      - name: Publish permanent web link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/pages origin/gh-pages
          mkdir -p /tmp/pages/regie-v14
          cp /tmp/regie-index.html /tmp/pages/regie-v14/index.html
          touch /tmp/pages/.nojekyll
          cd /tmp/pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add regie-v14/index.html .nojekyll
          if git diff --cached --quiet; then
            echo 'No web changes to publish.'
          else
            git commit -m 'Publish locked Regie V14.2 web app'
            git push origin HEAD:gh-pages
          fi
