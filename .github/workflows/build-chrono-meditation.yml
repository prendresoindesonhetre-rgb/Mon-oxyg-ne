name: Build Chrono Meditation APK

on:
  push:
    branches:
      - chrono-meditation-android
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Apply V6 clean source
        working-directory: ChronoMeditation
        run: |
          python3 v6_patch.py
          python3 v6_launch_fix.py

      - name: Build debug APK
        working-directory: ChronoMeditation
        run: gradle assembleDebug --no-daemon

      - name: Verify launcher class in APK
        working-directory: ChronoMeditation
        run: |
          unzip -p app/build/outputs/apk/debug/app-debug.apk classes.dex | strings | grep -q 'fr/prendresoindesonhetre/chronomeditation/MainActivity' || exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MesMeditations-Hetre-V6-fixed
          path: ChronoMeditation/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
