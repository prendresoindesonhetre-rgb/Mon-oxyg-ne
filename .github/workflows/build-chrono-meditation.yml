name: Build Chrono Meditation APK

on:
  push:
    branches:
      - chrono-meditation-android
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Apply V13 smart-session fixes
        working-directory: ChronoMeditation
        run: python3 v13_patch.py

      - name: Verify V13 source
        working-directory: ChronoMeditation
        run: |
          SRC=app/src/main/java/fr/prendresoindesonhetre/chronomeditation/MainActivity.java
          grep -F 'class ReadProgressView' "$SRC"
          grep -F 'readingStepCostMs' "$SRC"
          grep -F 'PHASES AUTO ✓' "$SRC"
          grep -F 'phaseElapsedMs >= planned && smartReadingFinished()' "$SRC"
          grep -F 'handler.postDelayed(this, 40L)' "$SRC"
          grep -F 'smoothVolumeRunnable' "$SRC"
          grep -F 'Math.pow(n, 1.65)' "$SRC"
          grep -F 'wantedPlay=false' "$SRC"
          grep -F 'AudioAttributes.CONTENT_TYPE_MUSIC' "$SRC"
          grep -F 'renderedPhaseIndex' "$SRC"

      - name: Build debug APK
        working-directory: ChronoMeditation
        run: gradle assembleDebug --no-daemon

      - name: Verify V13 launcher
        working-directory: ChronoMeditation
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/badging.txt
          grep -F "package: name='fr.prendresoindesonhetre.meditationshetre.v13'" /tmp/badging.txt
          grep -F "launchable-activity: name='fr.prendresoindesonhetre.chronomeditation.MainActivity'" /tmp/badging.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch and back-button smoke test on Android
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb install -r ChronoMeditation/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop fr.prendresoindesonhetre.meditationshetre.v13
            adb shell am start -W -n fr.prendresoindesonhetre.meditationshetre.v13/fr.prendresoindesonhetre.chronomeditation.MainActivity | tee /tmp/start.txt
            grep -F "Status: ok" /tmp/start.txt
            sleep 4
            adb shell dumpsys activity activities | grep -F "topResumedActivity" | grep -F "fr.prendresoindesonhetre.chronomeditation.MainActivity"
            adb shell input keyevent 4
            sleep 2
            adb shell dumpsys activity activities | grep -F "topResumedActivity" | grep -F "fr.prendresoindesonhetre.chronomeditation.MainActivity"
            ! adb logcat -d | grep -A 20 'FATAL EXCEPTION' | grep -F 'fr.prendresoindesonhetre.meditationshetre.v13'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Regie-de-mon-Hetre-V13-tested
          path: ChronoMeditation/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
