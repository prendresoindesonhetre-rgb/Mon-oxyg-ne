name: Build Chrono Meditation APK

on:
  push:
    branches:
      - chrono-meditation-android
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Apply V6 clean source
        working-directory: ChronoMeditation
        run: |
          python3 v6_patch.py
          python3 v6_launch_fix.py

      - name: Build debug APK
        working-directory: ChronoMeditation
        run: gradle assembleDebug --no-daemon

      - name: Verify Android launcher
        working-directory: ChronoMeditation
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='fr.prendresoindesonhetre.meditationshetre.v6'" /tmp/badging.txt
          grep -F "launchable-activity: name='fr.prendresoindesonhetre.chronomeditation.MainActivity'" /tmp/badging.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch smoke test on Android
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb install -r ChronoMeditation/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop fr.prendresoindesonhetre.meditationshetre.v6
            adb shell am start -W -n fr.prendresoindesonhetre.meditationshetre.v6/fr.prendresoindesonhetre.chronomeditation.MainActivity | tee /tmp/start.txt
            grep -F "Status: ok" /tmp/start.txt
            sleep 3
            adb shell dumpsys activity activities | grep -F "fr.prendresoindesonhetre.chronomeditation.MainActivity"
            adb logcat -d > /tmp/logcat.txt
            if grep -A30 -B5 -F "FATAL EXCEPTION" /tmp/logcat.txt | grep -F "fr.prendresoindesonhetre.meditationshetre.v6"; then
              echo "Application crashed during smoke test"
              exit 1
            fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MesMeditations-Hetre-V6-tested
          path: ChronoMeditation/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
