name: Build Chrono Meditation APK

on:
  push:
    branches:
      - chrono-meditation-android
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Finalize meditation companion source
        working-directory: ChronoMeditation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/fr/prendresoindesonhetre/chronomeditation/MainActivity.java')
          s = p.read_text()
          s = s.replace('Color.argb(70,turq)', 'Color.argb(70,Color.red(turq),Color.green(turq),Color.blue(turq))')
          s = s.replace('Color.argb(55,sky)', 'Color.argb(55,Color.red(sky),Color.green(sky),Color.blue(sky))')
          s = s.replace('Color.argb(45,violet)', 'Color.argb(45,Color.red(violet),Color.green(violet),Color.blue(violet))')
          s = s.replace('new Phase("Troisième temps — musique",20,', 'new Phase("Troisième temps — musique",15,')
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: ChronoMeditation
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MesMeditations-Android-v2
          path: ChronoMeditation/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
