name: Build Mon Oxygene Enchainements APK

on:
  push:
    branches: [ main ]
    paths:
      - 'webv40/**'
      - 'pwa/**'
      - 'scripts/apply_seconds_labels.py'
      - 'scripts/apply_v24_lotus_scale.py'
      - 'scripts/apply_v25_lotus_balance.py'
      - 'scripts/apply_v26_lotus_slightly_larger.py'
      - 'scripts/apply_v27_thinner_sinusoid.py'
      - 'scripts/apply_v28_thinner_line_only.py'
      - 'scripts/apply_v29_final_thinner_line.py'
      - 'scripts/apply_v31_lotus_slightly_smaller.py'
      - 'scripts/apply_v32_lotus_slightly_larger.py'
      - 'scripts/apply_v33_thinner_sinusoid_all.py'
      - 'scripts/apply_v34_wide_compat.py'
      - 'scripts/apply_v35_responsive_layout.py'
      - 'scripts/apply_v37_install_and_fresh_link.py'
      - 'scripts/apply_v38_true_responsive.py'
      - 'scripts/apply_v39_sideways_fit.py'
      - '.github/workflows/webv40-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare PWA assets
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install pillow
          python pwa/scripts/prepare_assets.py
          mkdir -p pwa/www/assets/rainstick
          curl -L --fail --retry 3 -o /tmp/ambient-rainstick-source.mp3 "https://upload.wikimedia.org/wikipedia/commons/transcoded/2/27/Rainstick.ogg/Rainstick.ogg.mp3?download="
          ffmpeg -hide_banner -loglevel error -y -i /tmp/ambient-rainstick-source.mp3 -af "lowpass=f=6000,equalizer=f=4000:t=q:w=1:g=-2.8,volume=0.97" pwa/www/assets/rainstick/ambient-rainstick.mp3

      - name: Preserve current v80 service worker
        run: |
          cp pwa/www/sw.js /tmp/sw-current.js
          cat > pwa/www/sw.js <<'EOF'
          const CACHE_NAME = 'mon-oxygene-pwa-v3-landscape';
          const CORE = [
            './',
            './index.html',
            './app.js',
            './styles.css',
            './manifest.webmanifest'
          ];
          self.addEventListener('install',e=>{self.skipWaiting();e.waitUntil(caches.open(CACHE_NAME).then(c=>c.addAll(CORE)))});
          self.addEventListener('activate',e=>{e.waitUntil(self.clients.claim())});
          self.addEventListener('fetch',e=>{if(e.request.method==='GET')e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)))});
          EOF

      - name: Apply validated Mon Oxygene visual patches
        run: |
          python scripts/apply_seconds_labels.py pwa
          python scripts/apply_v24_lotus_scale.py pwa
          python scripts/apply_v25_lotus_balance.py pwa
          python scripts/apply_v26_lotus_slightly_larger.py pwa
          python scripts/apply_v27_thinner_sinusoid.py pwa
          python scripts/apply_v28_thinner_line_only.py pwa
          python scripts/apply_v29_final_thinner_line.py pwa
          python scripts/apply_v31_lotus_slightly_smaller.py pwa
          python scripts/apply_v32_lotus_slightly_larger.py pwa
          python scripts/apply_v33_thinner_sinusoid_all.py pwa
          python scripts/apply_v34_wide_compat.py pwa
          python scripts/apply_v35_responsive_layout.py pwa
          python scripts/apply_v37_install_and_fresh_link.py pwa
          python scripts/apply_v38_true_responsive.py pwa
          python scripts/apply_v39_sideways_fit.py pwa

      - name: Restore current v80 service worker
        run: cp /tmp/sw-current.js pwa/www/sw.js

      - name: Verify phone and sequence layers
        run: |
          grep -q "Retrouver le calme" pwa/www/sequence.js
          grep -q "Retrouver de l’élan" pwa/www/sequence.js
          grep -q "ton ventre se gonfle" pwa/www/sequence.js
          grep -q "ton ventre se dégonfle" pwa/www/sequence.js
          grep -q "0.655 + 0.28" pwa/www/sequence.js
          grep -q "Rythme simple" pwa/www/v42-phone-layout.js
          grep -q "Enchaînements" pwa/www/v42-phone-layout.js
          grep -q "shortSide <= 650" pwa/www/v42-phone-layout.js
          test -f pwa/www/v42-phone-layout.css

      - name: Bundle the same web app inside Android
        run: |
          rm -rf webv40/app/src/main/assets/web
          mkdir -p webv40/app/src/main/assets/web
          cp -R pwa/www/. webv40/app/src/main/assets/web/

      - name: Build clean Android APK
        run: gradle -p webv40 :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Oxygene-Telephone-v42
          path: webv40/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
