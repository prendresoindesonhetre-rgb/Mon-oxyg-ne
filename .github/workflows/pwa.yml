name: Deploy Mon Oxygene PWA
on:
  push:
    branches: [main]
    paths:
      - 'pwa/**'
      - '.github/workflows/pwa.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pillow
      - name: Restore image assets
        run: python pwa/scripts/prepare_assets.py
      - name: Add enveloping rainstick recording
        run: |
          mkdir -p pwa/www/assets/rainstick
          curl -L --fail --retry 3 -o pwa/www/assets/rainstick/ambient-rainstick.mp3 "https://upload.wikimedia.org/wikipedia/commons/transcoded/2/27/Rainstick.ogg/Rainstick.ogg.mp3?download="
      - name: Validate PWA
        run: |
          set -e
          test -f pwa/www/index.html
          test -f pwa/www/app.js
          test -f pwa/www/styles.css
          test -f pwa/www/v44-rainstick.js
          test -f pwa/www/v59-settings-redesign.js
          test -f pwa/www/v59-settings-redesign.css
          test -f pwa/www/sw.js
          test -f pwa/www/assets/apple-touch-icon.png
          test -f pwa/www/assets/settings_bg.webp
          test -f pwa/www/assets/curve_bg.jpg
          test -f pwa/www/assets/lotus.png
          test -f pwa/www/assets/rainstick/up-8.mp3
          test -f pwa/www/assets/rainstick/down-8.mp3
          test -f pwa/www/assets/rainstick/ambient-rainstick.mp3
          grep -q 'v44-rainstick.js?v=68' pwa/www/index.html
          grep -q 'mon-oxygene-pwa-v68-safe-phone' pwa/www/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa/www
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4