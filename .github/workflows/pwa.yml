name: Deploy Mon Oxygene PWA
on:
  push:
    branches: [main]
    paths:
      - 'pwa/**'
      - '.github/workflows/pwa.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la version web
        run: |
          set -e
          for f in index.html style.css respiration.js baton-de-pluie.js plus.js app.js sw.js manifest.webmanifest confidentialite.html \
                   assets/settings_bg.webp assets/curve_bg.jpg assets/lotus.png assets/icon-192.png assets/icon-512.png assets/apple-touch-icon.png \
                   assets/presets/ralentir.png assets/presets/retrouver-calme.png assets/presets/equilibre.png \
                   assets/presets/retrouver-dynamisme.png assets/presets/dynamiser.png assets/rainstick/ambient-rainstick.mp3; do
            test -f "pwa/www/$f" || { echo "Fichier manquant : pwa/www/$f"; exit 1; }
          done
          for f in respiration.js baton-de-pluie.js plus.js app.js sw.js; do node --check "pwa/www/$f"; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa/www
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4