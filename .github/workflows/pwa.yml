name: Build and Deploy PWA

on:
  push:
    branches: [ main ]
    paths:
      - 'pwa/**'
      - 'app/src/main/assets/settings_exact/**'
      - 'app/src/main/java/fr/prendresoindesonhetre/monoxygene/AssetCurve*.java'
      - 'app/src/main/res/drawable/lotus_breathing.webp'
      - '.github/workflows/pwa.yml'
      - 'scripts/apply_seconds_labels.py'
      - 'scripts/apply_v24_lotus_scale.py'
      - 'scripts/apply_v25_lotus_balance.py'
  pull_request:
    branches: [ main ]
    paths:
      - 'pwa/**'
      - 'app/src/main/assets/settings_exact/**'
      - 'app/src/main/java/fr/prendresoindesonhetre/monoxygene/AssetCurve*.java'
      - 'app/src/main/res/drawable/lotus_breathing.webp'
      - '.github/workflows/pwa.yml'
      - 'scripts/apply_seconds_labels.py'
      - 'scripts/apply_v24_lotus_scale.py'
      - 'scripts/apply_v25_lotus_balance.py'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: python -m pip install pillow

      - name: Prepare exact Mon Oxygène assets
        run: python pwa/scripts/prepare_assets.py

      - name: Add seconds to breathing rhythm labels
        run: python scripts/apply_seconds_labels.py pwa

      - name: Apply smaller lotus breathing scale
        run: python scripts/apply_v24_lotus_scale.py pwa

      - name: Apply balanced lotus breathing scale
        run: python scripts/apply_v25_lotus_balance.py pwa

      - name: Validate PWA source
        run: |
          node --check pwa/www/app.js
          node --check pwa/www/orientation.js
          node --check pwa/www/sw.js
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('pwa/www')
          manifest = json.loads((root/'manifest.webmanifest').read_text(encoding='utf-8'))
          assert manifest['display'] == 'standalone'
          assert manifest['start_url'] == './'
          assert manifest['orientation'] == 'landscape'
          app_js = (root/'app.js').read_text(encoding='utf-8')
          for label in ['5s/5s', '4s/6s', '3s/5s', '6s/4s', '5s/3s']:
              assert label in app_js, label
          assert 'const scale = 0.64 + 0.48 * breathEase(elapsed);' in app_js
          assert "mon-oxygene-pwa-v6-lotus-balanced" in (root/'sw.js').read_text(encoding='utf-8')
          for name in ['index.html','styles.css','landscape-force.css','orientation.js','app.js','sw.js','manifest.webmanifest']:
              assert (root/name).exists(), name
          for name in ['settings_bg.jpg','curve_bg.jpg','lotus.png','icon-192.png','icon-512.png','apple-touch-icon.png']:
              assert (root/'assets'/name).exists(), name
          print('PWA paysage validée avec lotus équilibré')
          PY

      - name: Prepare static site
        run: |
          rm -rf pwa-dist
          mkdir pwa-dist
          cp -R pwa/www/. pwa-dist/
          touch pwa-dist/.nojekyll

      - name: Upload PWA build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Oxygene-PWA-v6-lotus-balanced
          path: pwa-dist
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pwa-dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record live PWA URL
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Save live URL in repository
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf '%s\n' "$PAGE_URL" > PWA_LIVE_URL.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PWA_LIVE_URL.txt
          if git diff --cached --quiet; then
            echo "URL déjà enregistrée"
          else
            git commit -m "Record live Mon Oxygène PWA URL"
            git push origin main
          fi
