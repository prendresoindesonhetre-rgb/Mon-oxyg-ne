name: Build Regie V14.3 Home Tabs APK

on:
  push:
    branches:
      - regie-v14-secure
    paths:
      - 'ChronoMeditation/**'
      - '.github/workflows/build-regie-v14.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V14 branch
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Rebuild the tested V13 base
        working-directory: ChronoMeditation
        run: python3 v13_patch.py

      - name: Apply secure account and permanent web wrapper
        working-directory: ChronoMeditation
        run: python3 v14_secure_web_patch.py

      - name: Match Android to exact permanent web layout
        working-directory: ChronoMeditation
        run: python3 v14_mobile_match_web.py

      - name: Verify locked Android source
        working-directory: ChronoMeditation
        run: |
          SRC=app/src/main/java/fr/prendresoindesonhetre/chronomeditation/MainActivity.java
          grep -F 'https://prendresoindesonhetre-rgb.github.io/Mon-oxyg-ne/regie-v14/' "$SRC"
          grep -F '?app=143' "$SRC"
          grep -F 's.setLoadWithOverviewMode(false);' "$SRC"
          grep -F 's.setUseWideViewPort(false);' "$SRC"
          grep -F 's.setTextZoom(100);' "$SRC"
          grep -F "applicationId 'fr.prendresoindesonhetre.meditationshetre.v14'" app/build.gradle
          grep -F 'versionCode 143' app/build.gradle
          grep -F "versionName '14.3-home-tabs'" app/build.gradle
          grep -F 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -F 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          grep -F 'android.permission.INTERNET' app/src/main/AndroidManifest.xml

      - name: Verify published web source contains locked validated functions
        run: |
          git fetch origin gh-pages
          git show origin/gh-pages:regie-v14/index.html > /tmp/regie-live.html
          grep -q 'locked-session-type-script-v142' /tmp/regie-live.html
          grep -q 'id="homeSessionTypePicker"' /tmp/regie-live.html
          grep -q 'data-session-type="meditation"' /tmp/regie-live.html
          grep -q 'data-session-type="hypnose"' /tmp/regie-live.html
          grep -q 'Méditation' /tmp/regie-live.html
          grep -q 'Hypnose' /tmp/regie-live.html
          grep -q 'mobile-player-v141' /tmp/regie-live.html
          grep -q 'id="autoRow"' /tmp/regie-live.html
          grep -q 'id="guideScroll"' /tmp/regie-live.html
          grep -q 'id="playPauseBtn"' /tmp/regie-live.html
          grep -q 'id="musicCard"' /tmp/regie-live.html
          grep -q 'id="phaseAutoBtn"' /tmp/regie-live.html
          grep -q 'id="accountBtn"' /tmp/regie-live.html
          grep -q 'regie-sync' /tmp/regie-live.html
          grep -q 'manualScrollUntil' /tmp/regie-live.html
          grep -q 'function toggleRun' /tmp/regie-live.html
          grep -q 'faderEdge' /tmp/regie-live.html

      - name: Build debug APK
        working-directory: ChronoMeditation
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK identity
        working-directory: ChronoMeditation
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/badging.txt
          grep -F "package: name='fr.prendresoindesonhetre.meditationshetre.v14'" /tmp/badging.txt
          grep -F "versionCode='143'" /tmp/badging.txt
          grep -F "versionName='14.3-home-tabs'" /tmp/badging.txt
          grep -F "application-label:'Régie de mon Hêtre'" /tmp/badging.txt
          grep -F "launchable-activity: name='fr.prendresoindesonhetre.chronomeditation.MainActivity'" /tmp/badging.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android launch smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb install ChronoMeditation/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n fr.prendresoindesonhetre.meditationshetre.v14/fr.prendresoindesonhetre.chronomeditation.MainActivity | tee /tmp/start.txt
            grep -F "Status: ok" /tmp/start.txt
            sleep 7
            adb shell dumpsys activity activities | grep -F "topResumedActivity" | grep -F "fr.prendresoindesonhetre.chronomeditation.MainActivity"
            ! adb logcat -d | grep -A 30 'FATAL EXCEPTION' | grep -F 'fr.prendresoindesonhetre.meditationshetre.v14'

      - name: Upload V14.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: Regie-de-mon-Hetre-V14.3-home-tabs-tested
          path: ChronoMeditation/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
