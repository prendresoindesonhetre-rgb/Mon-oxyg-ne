name: Restore Regie Selector

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/patch_regie_selector.py'
      - 'scripts/patch_regie_instruments.py'
      - 'scripts/patch_regie_whole_seconds.py'
      - 'scripts/patch_regie_professional_builder.py'
      - 'scripts/patch_regie_import_maquette.py'
      - 'scripts/patch_regie_visual_harmony.py'
      - 'scripts/patch_regie_global_compact.py'
      - 'scripts/patch_regie_text_priority.py'
      - 'scripts/patch_regie_pro_hierarchy.py'
      - 'scripts/patch_regie_live_priority.py'
      - 'scripts/patch_regie_space_air.py'
      - 'scripts/patch_regie_live_layout.py'
      - 'scripts/patch_regie_balanced_live.py'
      - '.github/workflows/restore-regie-selector.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout patches
        uses: actions/checkout@v4

      - name: Recover stable Mon Oxygene build
        uses: actions/download-artifact@v4
        with:
          name: Mon-Oxygene-PWA-v18-sideways-fit
          path: pwa-dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33671187910

      - name: Restore all Regie V14 functions
        run: python scripts/patch_regie_v14.py pwa-dist/regie-v14/index.html

      - name: Restore Meditation Hypnosis selector
        run: python scripts/patch_regie_selector.py pwa-dist/regie-v14/index.html

      - name: Install simplified instrument animations
        run: python scripts/patch_regie_instruments.py pwa-dist/regie-v14/index.html

      - name: Keep rain stick timing on whole seconds
        run: python scripts/patch_regie_whole_seconds.py pwa-dist/regie-v14/index.html

      - name: Install professional session builder
        run: python scripts/patch_regie_professional_builder.py pwa-dist/regie-v14/index.html

      - name: Install Word and text mockup importer
        run: python scripts/patch_regie_import_maquette.py pwa-dist/regie-v14/index.html

      - name: Harmonize proportions and Prendre soin de son Hetre identity
        run: python scripts/patch_regie_visual_harmony.py pwa-dist/regie-v14/index.html

      - name: Enforce compact controls everywhere
        run: python scripts/patch_regie_global_compact.py pwa-dist/regie-v14/index.html

      - name: Make spoken text the main live area
        run: python scripts/patch_regie_text_priority.py pwa-dist/regie-v14/index.html

      - name: Apply professional hierarchy everywhere
        run: python scripts/patch_regie_pro_hierarchy.py pwa-dist/regie-v14/index.html

      - name: Prioritize live text and restore wheel mode
        run: python scripts/patch_regie_live_priority.py pwa-dist/regie-v14/index.html

      - name: Air the space chooser without enlarging controls
        run: python scripts/patch_regie_space_air.py pwa-dist/regie-v14/index.html

      - name: Make text the main live workspace
        run: python scripts/patch_regie_live_layout.py pwa-dist/regie-v14/index.html

      - name: Rebalance live regie around text
        run: python scripts/patch_regie_balanced_live.py pwa-dist/regie-v14/index.html

      - name: Validate complete Regie
        run: |
          grep -q 'Séance de méditation' pwa-dist/regie-v14/index.html
          grep -q 'Séance d’hypnose' pwa-dist/regie-v14/index.html
          grep -q '+ Créer une séance' pwa-dist/regie-v14/index.html
          grep -q 'addPhaseBtn' pwa-dist/regie-v14/index.html
          grep -q 'chooseMeditationSpace' pwa-dist/regie-v14/index.html
          grep -q 'chooseHypnoseSpace' pwa-dist/regie-v14/index.html
          grep -q 'if(!playing||!running)return' pwa-dist/regie-v14/index.html
          grep -q 'simpleRainTube' pwa-dist/regie-v14/index.html
          grep -q 'rainBeads' pwa-dist/regie-v14/index.html
          grep -q 'simpleOceanDrum' pwa-dist/regie-v14/index.html
          grep -q 'oceanBeads' pwa-dist/regie-v14/index.html
          grep -q 'Construction de la séance' pwa-dist/regie-v14/index.html
          grep -q 'Transition vers la phase suivante' pwa-dist/regie-v14/index.html
          grep -q 'Passage à la phase suivante' pwa-dist/regie-v14/index.html
          grep -q 'M’avertir avant la fin' pwa-dist/regie-v14/index.html
          grep -q 'phaseDurationMs' pwa-dist/regie-v14/index.html
          grep -q 'phaseWaveSeconds' pwa-dist/regie-v14/index.html
          grep -q 'musicSlot' pwa-dist/regie-v14/index.html
          grep -q 'Importer / Coller' pwa-dist/regie-v14/index.html
          grep -q 'Générer la maquette' pwa-dist/regie-v14/index.html
          grep -q 'buildMaquetteDraft' pwa-dist/regie-v14/index.html
          grep -q 'mammoth.browser.min.js' pwa-dist/regie-v14/index.html
          grep -q 'Utiliser cette maquette' pwa-dist/regie-v14/index.html
          grep -q 'VISUAL_HARMONY_HETRE' pwa-dist/regie-v14/index.html
          grep -q 'COMPACT_SESSION_LIBRARY_V2' pwa-dist/regie-v14/index.html
          grep -q 'GLOBAL_COMPACT_AUDIT_V4' pwa-dist/regie-v14/index.html
          grep -q 'TEXT_PRIORITY_V1' pwa-dist/regie-v14/index.html
          grep -q 'PRO_HIERARCHY_V1' pwa-dist/regie-v14/index.html
          grep -q 'LIVE_PRIORITY_V2' pwa-dist/regie-v14/index.html
          grep -q 'SPACE_AIR_V1' pwa-dist/regie-v14/index.html
          grep -q 'LIVE_LAYOUT_V3' pwa-dist/regie-v14/index.html
          grep -q 'BALANCED_LIVE_V1' pwa-dist/regie-v14/index.html
          grep -q 'wheelModeRow' pwa-dist/regie-v14/index.html
          grep -q 'wheelScrollMode' pwa-dist/regie-v14/index.html
          grep -q 'wheelSoundMode' pwa-dist/regie-v14/index.html
          grep -q 'guideFullscreenBtn' pwa-dist/regie-v14/index.html
          grep -q '⛶ Plein écran' pwa-dist/regie-v14/index.html
          grep -q 'currentWheelMode' pwa-dist/regie-v14/index.html
          grep -q 'document.documentElement' pwa-dist/regie-v14/index.html
          grep -q 'musicCollapsed=true' pwa-dist/regie-v14/index.html
          grep -q '#playerView #guideCard' pwa-dist/regie-v14/index.html
          grep -q -- '--sky:#9bcbd6' pwa-dist/regie-v14/index.html
          grep -q '#createSessionBtn' pwa-dist/regie-v14/index.html
          grep -q 'session-actions,.session-more' pwa-dist/regie-v14/index.html
          grep -q '#playerView .music-controls,#playerView .auto-row,#playerView .control-row' pwa-dist/regie-v14/index.html
          grep -q 'textarea\[data-k="text"\].*230px' pwa-dist/regie-v14/index.html || grep -q 'min-height:230px' pwa-dist/regie-v14/index.html
          grep -q 'width:min(940px,100%)' pwa-dist/regie-v14/index.html
          if grep -q '4,75' pwa-dist/regie-v14/index.html; then exit 1; fi
          if grep -q 'assets/rain-stick.jpg' pwa-dist/regie-v14/index.html; then exit 1; fi
          if grep -q 'assets/ocean-drum.jpg' pwa-dist/regie-v14/index.html; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          h=Path('pwa-dist/regie-v14/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>([\s\S]*?)</script>',h)
          assert scripts
          Path('/tmp/regie.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/regie.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload restored site
        uses: actions/upload-pages-artifact@v3
        with:
          path: pwa-dist

      - name: Deploy restored site
        id: deployment
        uses: actions/deploy-pages@v4
