# Construit Mon Oxygène pour le Play Store (dossier playstore/) :
# - Mon-Oxygene-PlayStore-vN.aab : le fichier à envoyer dans la Play Console ;
# - Mon-Oxygene-essai-vN.apk : la même appli, à installer directement sur un téléphone pour l'essayer.
# Les deux sont signés avec la clé d'envoi, donnée par les secrets MON_OXYGENE_CLE et MON_OXYGENE_MOT_DE_PASSE
# (Settings → Secrets and variables → Actions). Sans eux, ils sont signés avec une clé de test : le Play Store les refuse.
# L'APK d'essai est aussi déposé seul sur la branche apk-essai, d'où il est récupéré pour l'installer.
name: Mon Oxygène pour le Play Store

on:
  push:
    branches: [main, 'claude/**']
    paths: ['playstore/**', 'pwa/www/**', '.github/workflows/playstore.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Préparer la clé d'envoi
        env:
          CLE: ${{ secrets.MON_OXYGENE_CLE }}
        run: |
          if [ -n "$CLE" ]; then
            printf '%s' "$CLE" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/cle-envoi.p12"
            echo "MON_OXYGENE_CLE_FICHIER=$RUNNER_TEMP/cle-envoi.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Secrets MON_OXYGENE_CLE et MON_OXYGENE_MOT_DE_PASSE absents : fichiers signés avec la clé de test, refusés par le Play Store."
          fi

      - name: Construire l'AAB et l'APK d'essai
        env:
          MON_OXYGENE_MOT_DE_PASSE: ${{ secrets.MON_OXYGENE_MOT_DE_PASSE }}
        run: gradle -p playstore :app:bundleRelease :app:assembleRelease -PnumeroVersion=${{ github.run_number }} --stacktrace

      - name: Vérifier et rassembler
        run: |
          OUTILS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          mkdir sortie
          cp playstore/app/build/outputs/bundle/release/app-release.aab "sortie/Mon-Oxygene-PlayStore-v${{ github.run_number }}.aab"
          cp playstore/app/build/outputs/apk/release/app-release.apk "sortie/Mon-Oxygene-essai-v${{ github.run_number }}.apk"
          "$OUTILS/aapt2" dump badging sortie/*.apk | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|uses-permission)"
          "$OUTILS/aapt2" dump badging sortie/*.apk | grep -q "targetSdkVersion:'36'"
          unzip -l sortie/*.apk | grep -q "assets/web/plus.js" || { echo "Contenu web absent de l'appli"; exit 1; }
          unzip -l sortie/*.apk | grep -q "assets/web/regie-v14" && { echo "La Régie ne doit pas être dans l'appli"; exit 1; } || true
          echo "Certificat de l'APK d'essai :"
          "$OUTILS/apksigner" verify --print-certs sortie/*.apk | grep -E "DN|SHA-256"
          echo "Certificat de l'AAB (à comparer au « certificat de clé d'importation » de la Play Console) :"
          keytool -printcert -jarfile sortie/*.aab | grep -E "Owner|Propriétaire|SHA256"
          rm -f "$RUNNER_TEMP/cle-envoi.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: Mon-Oxygene-PlayStore-v${{ github.run_number }}
          path: sortie/
          if-no-files-found: error

      - name: Déposer l'APK d'essai sur la branche apk-essai
        run: |
          mkdir -p "$RUNNER_TEMP/apk-essai" && cd "$RUNNER_TEMP/apk-essai"
          cp "$GITHUB_WORKSPACE"/sortie/*.apk Mon-Oxygene-essai.apk
          git init -q && git checkout -q -b apk-essai && git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "APK d'essai Mon Oxygène, version ${{ github.run_number }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk-essai
