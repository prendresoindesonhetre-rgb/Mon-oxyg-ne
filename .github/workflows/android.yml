name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply Mon Oxygène v5 interface
        run: cat app/src/main/v5source/*.part > app/src/main/java/fr/prendresoindesonhetre/monoxygene/MainActivity.java
      - name: Apply Mon Oxygène v6 refinements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/fr/prendresoindesonhetre/monoxygene/MainActivity.java')
          s = path.read_text(encoding='utf-8')

          # Textes d'explication un peu plus grands, sans perdre l'aération.
          s = s.replace('float bodySize=introPage==5?h*.024f:h*.026f;',
                        'float bodySize=introPage==5?h*.0270f:h*.0290f;')
          s = s.replace('h*.0215f,Color.rgb(65,84,98),1.35f,bodyFace)',
                        'h*.0235f,Color.rgb(65,84,98),1.38f,bodyFace)')
          s = s.replace('h*.020f,Color.rgb(62,135,151),Paint.Align.LEFT,accentFace)',
                        'h*.0220f,Color.rgb(62,135,151),Paint.Align.LEFT,accentFace)')
          s = s.replace('h*.020f,Color.rgb(111,88,176),Paint.Align.LEFT,accentFace)',
                        'h*.0220f,Color.rgb(111,88,176),Paint.Align.LEFT,accentFace)')
          s = s.replace('h*.0205f,Color.rgb(58,115,134),Paint.Align.CENTER,accentFace)',
                        'h*.0220f,Color.rgb(58,115,134),Paint.Align.CENTER,accentFace)')
          s = s.replace('h*.0225f,colors[i],Paint.Align.LEFT,mediumFace)',
                        'h*.0240f,colors[i],Paint.Align.LEFT,mediumFace)')
          s = s.replace('h*.0205f,colors[i],Paint.Align.RIGHT,mediumFace)',
                        'h*.0220f,colors[i],Paint.Align.RIGHT,mediumFace)')
          s = s.replace('h*.0185f,Color.rgb(68,86,99),1.26f,bodyFace)',
                        'h*.0200f,Color.rgb(68,86,99),1.28f,bodyFace)')
          s = s.replace('right-left,h*.021f,Color.rgb(58,123,139),1.34f,accentFace)',
                        'right-left,h*.0225f,Color.rgb(58,123,139),1.36f,accentFace)')

          # Chrono de séance : plus grand, plus lisible et posé dans une petite capsule.
          old = '''int sec=(int)Math.ceil(remain); String time=String.format(Locale.FRANCE,"%d:%02d",sec/60,sec%60);\n            textFace(c,time,w*.925f,h*.092f,h*.027f,Color.WHITE,Paint.Align.CENTER,mediumFace);'''
          new = '''int sec=(int)Math.ceil(remain); String time=String.format(Locale.FRANCE,"%d:%02d",sec/60,sec%60);\n            RectF timePill=new RectF(w*.835f,h*.055f,w*.965f,h*.125f);\n            p.setColor(Color.argb(135,255,255,255)); c.drawRoundRect(timePill,34,34,p);\n            p.setStyle(Paint.Style.STROKE); p.setStrokeWidth(Math.max(1.5f,w*.0011f)); p.setColor(Color.argb(115,100,183,208)); c.drawRoundRect(timePill,34,34,p); p.setStyle(Paint.Style.FILL);\n            textFace(c,time,timePill.centerX(),timePill.centerY()+h*.012f,h*.035f,Color.rgb(50,86,112),Paint.Align.CENTER,mediumFace);'''
          s = s.replace(old,new)

          # Barre de progression : plus présente, avec un halo très doux.
          old = '''p.setColor(Color.argb(95,255,255,255)); c.drawRoundRect(progL,progY,progR,progY+h*.008f,12,12,p);\n            LinearGradient progGrad=new LinearGradient(progL,0,progR,0,new int[]{Color.rgb(73,207,216),Color.rgb(118,179,229),Color.rgb(150,127,217)},null,Shader.TileMode.CLAMP);\n            p.setShader(progGrad); c.drawRoundRect(progL,progY,progL+(progR-progL)*progress,progY+h*.008f,12,12,p); p.setShader(null);'''
          new = '''p.setColor(Color.argb(105,255,255,255)); c.drawRoundRect(progL,progY-h*.004f,progR,progY+h*.016f,16,16,p);\n            p.setColor(Color.argb(55,90,202,224)); c.drawRoundRect(progL,progY-h*.008f,progL+(progR-progL)*progress,progY+h*.020f,18,18,p);\n            LinearGradient progGrad=new LinearGradient(progL,0,progR,0,new int[]{Color.rgb(73,207,216),Color.rgb(118,179,229),Color.rgb(150,127,217)},null,Shader.TileMode.CLAMP);\n            p.setShader(progGrad); c.drawRoundRect(progL,progY,progL+(progR-progL)*progress,progY+h*.012f,14,14,p); p.setShader(null);'''
          s = s.replace(old,new)

          # Fleur plus organique : double rangée de pétales, centre lumineux et halo discret.
          replacement = '''void drawBreathingFlower(Canvas c,float cx,float cy,float radius,float scale){
            c.save(); c.translate(cx,cy); c.scale(scale,scale);

            p.setStyle(Paint.Style.FILL);
            p.setColor(Color.argb(42,101,205,226)); c.drawCircle(0,0,radius*1.58f,p);
            p.setColor(Color.argb(35,155,132,226)); c.drawCircle(0,0,radius*1.34f,p);

            int[] outer={Color.argb(185,75,211,220),Color.argb(178,104,190,235),Color.argb(172,153,130,226),Color.argb(178,91,202,225)};
            for(int i=0;i<10;i++){
                c.save(); c.rotate(i*36f);
                p.setColor(outer[i%outer.length]);
                RectF petal=new RectF(-radius*.29f,-radius*1.48f,radius*.29f,-radius*.23f);
                c.drawOval(petal,p);
                c.restore();
            }

            int[] inner={Color.argb(232,87,216,222),Color.argb(226,112,196,236),Color.argb(220,156,132,226)};
            for(int i=0;i<6;i++){
                c.save(); c.rotate(30f+i*60f);
                p.setColor(inner[i%inner.length]);
                RectF petal=new RectF(-radius*.30f,-radius*1.02f,radius*.30f,-radius*.12f);
                c.drawOval(petal,p);
                c.restore();
            }

            p.setColor(Color.argb(245,248,252,253)); c.drawCircle(0,0,radius*.38f,p);
            LinearGradient heart=new LinearGradient(-radius*.20f,-radius*.20f,radius*.20f,radius*.20f,
                    new int[]{Color.rgb(90,211,220),Color.rgb(124,184,233),Color.rgb(158,132,224)},null,Shader.TileMode.CLAMP);
            p.setShader(heart); c.drawCircle(0,0,radius*.22f,p); p.setShader(null);
            p.setColor(Color.argb(210,255,255,255)); c.drawCircle(-radius*.075f,-radius*.075f,radius*.055f,p);

            p.setStyle(Paint.Style.STROKE);
            p.setStrokeWidth(Math.max(1.4f,radius*.065f));
            p.setColor(Color.argb(120,255,255,255)); c.drawCircle(0,0,radius*1.53f,p);
            p.setStyle(Paint.Style.FILL);
            c.restore();
        }

        void drawTinyFlower'''
          s, n = re.subn(r'void drawBreathingFlower\(Canvas c,float cx,float cy,float radius,float scale\)\{.*?\n        \}\n\n        void drawTinyFlower', replacement, s, flags=re.S)
          if n != 1:
              raise SystemExit(f'flower replacement count={n}')

          path.write_text(s,encoding='utf-8')
          PY
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Oxygene-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
