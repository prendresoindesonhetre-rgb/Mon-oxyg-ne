name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply Mon Oxygène v6 interface
        run: cat app/src/main/v6source/*.part > app/src/main/java/fr/prendresoindesonhetre/monoxygene/MainActivity.java
      - name: Apply Mon Oxygène v7 refinements
        run: python3 scripts/apply_v7.py
      - name: Apply Mon Oxygène v8 lotus and readability
        run: python3 scripts/apply_v8.py
      - name: Apply Mon Oxygène v9 breathing guidance
        run: python3 scripts/apply_v9.py
      - name: Apply Mon Oxygène v10 visual breathing cues
        run: python3 scripts/apply_v10.py
      - name: Apply Mon Oxygène v11 lower curve and larger guidance
        run: python3 scripts/apply_v11.py
      - name: Apply Mon Oxygène v12 larger sub-guidance only
        run: python3 scripts/apply_v12.py
      - name: Apply Mon Oxygène v13 amplitude and first slide
        run: python3 scripts/apply_v13.py
      - name: Apply Mon Oxygène v14 clean breathing lotus
        run: python3 scripts/apply_v14.py
      - name: Apply Mon Oxygène v15 synchronized lotus breathing
        run: python3 scripts/apply_v15.py
      - name: Apply Mon Oxygène v16 stronger lotus breathing
        run: python3 scripts/apply_v16.py
      - name: Apply Mon Oxygène v17 smaller lotus at exhale end
        run: python3 scripts/apply_v17.py
      - name: Apply Mon Oxygène v18 stronger progress bar
        run: python3 scripts/apply_v18.py
      - name: Apply Mon Oxygène v19 swapped aligned controls
        run: python3 scripts/apply_v19.py
      - name: Apply Mon Oxygène v20 controls top and time bottom
        run: python3 scripts/apply_v20.py
      - name: Apply Mon Oxygène v21 stronger controls
        run: python3 scripts/apply_v21.py
      - name: Apply Mon Oxygène v22 tablet layout
        run: python3 scripts/apply_v22_tablet.py
      - name: Add seconds to breathing rhythm labels
        run: python3 scripts/apply_seconds_labels.py android
      - name: Apply Mon Oxygène v24 smaller lotus scale
        run: python3 scripts/apply_v24_lotus_scale.py android
      - name: Apply Mon Oxygène v25 balanced lotus scale
        run: python3 scripts/apply_v25_lotus_balance.py android
      - name: Apply Mon Oxygène v26 slightly larger lotus
        run: python3 scripts/apply_v26_lotus_slightly_larger.py android
      - name: Apply Mon Oxygène v27 thinner sinusoid
        run: python3 scripts/apply_v27_thinner_sinusoid.py android
      - name: Apply Mon Oxygène v28 thinner line only
        run: python3 scripts/apply_v28_thinner_line_only.py android
      - name: Apply Mon Oxygène v29 final thinner line
        run: python3 scripts/apply_v29_final_thinner_line.py android
      - name: Apply Mon Oxygène v30 tablet sinusoid line
        run: python3 scripts/apply_v30_tablet_sinusoid_line.py
      - name: Apply Mon Oxygène v31 slightly smaller lotus
        run: python3 scripts/apply_v31_lotus_slightly_smaller.py android
      - name: Apply Mon Oxygène v32 slightly larger lotus
        run: python3 scripts/apply_v32_lotus_slightly_larger.py android
      - name: Apply Mon Oxygène v33 thinner sinusoid everywhere
        run: python3 scripts/apply_v33_thinner_sinusoid_all.py android
      - name: Apply Mon Oxygène v34 wide Android compatibility
        run: python3 scripts/apply_v34_wide_compat.py android
      - name: Apply Mon Oxygène v35 automatic responsive layout
        run: python3 scripts/apply_v35_responsive_layout.py android
      - name: Check Android 4.4 compatibility
        run: gradle :app:lintDebug --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Oxygene-APK-v35
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
